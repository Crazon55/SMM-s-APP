services:
  - type: web
    name: dos-server
    env: node
    plan: free

    buildCommand: |
      cd server
      npm install
      npm run build

    startCommand: |
      cd server
      npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/server/dist/data

    disk:
      name: dos-data
      mountPath: /opt/render/project/src/server/dist/data
      sizeGB: 1

